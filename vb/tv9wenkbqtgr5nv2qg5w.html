<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>金融 IT 厂商中标看板</title>
<style>
:root{
  --ink:#1b2433; --ink2:#5d6878; --ink3:#8a94a3;
  --line:#e6eaf1; --line2:#eef1f6;
  --bg:#f3f5f8; --card:#ffffff;
  --accent:#0b5cad; --accent-soft:#e9f2fc; --accent-ink:#0a4f96;
  --hs:#0b6e4f; --hs-soft:#e6f4ee;
  --cp:#b45309; --cp-soft:#fdf2e3;
  --gold:#b78900; --silver:#7c8698; --bronze:#a86a32;
  --shadow:0 1px 2px rgba(16,30,54,.05),0 4px 16px rgba(16,30,54,.06);
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
  font-variant-numeric:tabular-nums;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums lining-nums}

/* ---------- 顶栏 ---------- */
.topbar{background:linear-gradient(135deg,#10233f 0%,#0b5cad 120%);color:#fff;padding:18px 20px 16px}
.topbar .wrap{max-width:1200px;margin:0 auto}
.topbar h1{font-size:19px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar .logo{display:inline-flex;width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.14);align-items:center;justify-content:center;font-size:14px}
.topbar .sub{margin-top:6px;font-size:12px;color:rgba(255,255,255,.72);display:flex;gap:14px;flex-wrap:wrap}
.topbar .sub b{color:#fff;font-weight:600}
.topbar .actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:8px;transition:all .15s}
.btn-light{background:rgba(255,255,255,.16);color:#fff}
.btn-light:hover{background:rgba(255,255,255,.26)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink)}
.btn-ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}

/* ---------- 统计卡 ---------- */
.stats{max-width:1200px;margin:-0px auto 0;padding:14px 16px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.stat .lab{font-size:11.5px;color:var(--ink3);letter-spacing:.4px}
.stat .val{font-size:21px;font-weight:700;margin-top:3px;letter-spacing:.2px}
.stat .val small{font-size:12px;font-weight:500;color:var(--ink3);margin-left:2px}
.stat .trend{font-size:11px;margin-top:3px;color:var(--ink2)}

/* ---------- 标签页（分段控件：立体边界、显性风格） ---------- */
.tabwrap{max-width:1200px;margin:12px auto 0;padding:0 16px}
.tabs{position:sticky;top:0;z-index:30;display:flex;gap:4px;background:#e8ecf2;border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:inset 0 1px 3px rgba(16,30,54,.08)}
.tab{flex:1;max-width:220px;text-align:center;padding:9px 10px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;border-radius:9px;border:1px solid transparent;background:transparent;position:relative;transition:all .15s}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.6)}
.tab.on{color:var(--accent);background:#fff;border-color:var(--line);box-shadow:0 2px 6px rgba(16,30,54,.12),0 1px 2px rgba(16,30,54,.08)}
.tab .cnt{font-size:11px;font-weight:500;color:var(--ink3);margin-left:4px}
.tab.on .cnt{color:var(--accent)}

.pane{display:none;padding:14px 0 40px}
.pane.on{display:block}

/* ---------- 卡片/区块 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px}
.card .chd{padding:13px 16px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card .chd h3{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.card .chd h3::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent)}
.card .cbd{padding:12px 16px}

/* ---------- 趋势图 ---------- */
.chart-legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink2)}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:99;background:#1b2433;color:#fff;font-size:11.5px;padding:7px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.tip b{color:#ffd166}

/* ---------- 控件 ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fbfcfe;outline:none;transition:border .15s}
.search input:focus{border-color:var(--accent);background:#fff}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on.hs{background:var(--hs);border-color:var(--hs)}
.chip.on.cp{background:var(--cp);border-color:var(--cp)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:none;background:#fff;padding:7px 13px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- 表格 ---------- */
.tblwrap{-webkit-overflow-scrolling:touch}
/* 桌面端不横滚：overflow 滚动容器会把 th sticky 关进"无高度容器"导致表头不固定（11-06 周老师抓包根因） */
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{position:sticky;top:46px;z-index:5;background:#f8fafc;color:var(--ink2);font-size:11.5px;font-weight:600;text-align:center;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb th.thwrap{white-space:normal;line-height:1.35}
.tb td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tb tbody tr{transition:background .1s}
.tb tbody tr:hover{background:#f6f9fd}
.tb tbody tr.clickable{cursor:pointer}
/* 表格模式（搜索/分组过滤）自带滚动区：垂直+水平滚动条，表头在滚动区内钉住 */
.tblwrap.box{max-height:calc(100vh - 250px);overflow:auto;border-top:1px solid var(--line2)}
.tblwrap.box .tb th{top:0}
.rk{display:inline-flex;width:22px;height:22px;border-radius:7px;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;background:#eef1f6;color:var(--ink2);white-space:nowrap;flex:none}
.rk.r1{background:linear-gradient(135deg,#ffd76a,#f5b301);color:#5c4400}
.rk.r2{background:linear-gradient(135deg,#e3e8f0,#c3ccd9);color:#3d4654}
.rk.r3{background:linear-gradient(135deg,#f0c39a,#d9985f);color:#5c3a12}
.vname{font-weight:600}
.vfull{display:block;font-size:11px;color:var(--ink3);font-weight:400;margin-top:1px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.hs{background:var(--hs-soft);color:var(--hs)}
.tag.cp{background:var(--cp-soft);color:var(--cp)}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.amt small{font-weight:400;color:var(--ink3);font-size:11px}
.cnt-n{color:var(--ink2);white-space:nowrap;text-align:right}
.spark{display:block;width:100%;height:26px}
.empty{padding:38px 0;text-align:center;color:var(--ink3);font-size:13px}
/* 分组过滤态冗余的走势列：窄屏隐藏保阅读体验（周老师 11-06 裁定） */
@media (max-width:900px){.cspk{display:none}}

/* ---------- 明细分栏墙（桌面全量浏览：每栏30家，一栏一屏看全，不用滚屏） ---------- */
.detwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:14px 16px}
.detcol{background:#fbfcfe;border:1px solid var(--line);border-radius:10px;overflow:auto;align-self:start;max-height:calc(100vh - 170px)}
.detcol-hd{display:flex;justify-content:space-between;padding:6px 12px 5px;font-size:11px;color:var(--ink3);border-bottom:1px solid var(--line2);background:#f4f7fb;position:sticky;top:0;z-index:2}
.detrow{display:flex;align-items:baseline;gap:7px;padding:2px 12px;cursor:pointer;line-height:1.35;font-size:12px}
.detrow:hover{background:#eef5fd}
.detrow .rk{width:18px;height:18px;font-size:10px;border-radius:6px}
.detrow .nm{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.detrow .mc{font-size:10.5px;color:var(--ink3);white-space:nowrap}
.detrow .as{font-size:11px;font-weight:700;white-space:nowrap}
/* 竞品/恒生系在分栏墙中的显性标识（恢复旧看板设计） */
.detrow.cp{background:#fdf4e7}
.detrow.cp .nm{color:#9a4a08}
.detrow.hs{background:#edf7f2}
.detrow.hs .nm{color:#0b6e4f}
@media (max-width:640px){
  .tblwrap{overflow-x:auto}
  table.tb{min-width:640px}
  /* 窄屏（含侧栏小组件 iframe、手机）保留多栏分块+栏内滚动：栏收窄到可并排两栏 */
  .detwall{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:10px}
  .detrow{padding:2px 8px;font-size:11.5px}
  .tb th{top:44px}
}

/* ---------- 宿主（侧栏小组件）顶部悬浮区避让：整页下移 84px，标签页等可点控件全部离开顶部 80px 悬停/拖拽层 ---------- */
body.host #app{padding-top:84px}
/* 侧栏里标签页不吸顶（11-06 周老师实证：浮动标签压住滚动内容、阅读体验差），随内容滚动；网页版保持吸顶 */
body.host .tabs{position:static;top:auto}

/* ---------- 明细抽屉 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,25,42,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100vw;background:#fff;z-index:61;box-shadow:-8px 0 30px rgba(16,30,54,.18);transform:translateX(102%);transition:transform .22s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer .dhd{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer .dhd h2{font-size:16px;font-weight:700}
.drawer .dhd .full{font-size:12px;color:var(--ink3);margin-top:3px}
.drawer .dhd .x{border:none;background:#eef1f6;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--ink2);flex:none}
.drawer .dsub{display:flex;gap:14px;padding:10px 18px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink2);flex-wrap:wrap}
.drawer .dsub b{color:var(--ink);font-size:14px}
.drawer .dbody{flex:1;overflow-y:auto;padding:8px 18px 24px}
.itm{border-bottom:1px solid var(--line2);padding:10px 0}
.itm .row1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.itm .pn{font-size:13px;font-weight:600;color:var(--ink);flex:1}
.itm .pn a{color:var(--ink)}
.itm .pn a:hover{color:var(--accent)}
.itm .ia{font-weight:700;white-space:nowrap}
.itm .row2{display:flex;gap:10px;margin-top:4px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.itm .org{color:var(--ink2);font-weight:600}

/* ---------- 加载/空态 ---------- */
.loadmore{text-align:center;padding:14px;color:var(--ink3);font-size:12px}

/* ---------- 加密门禁 ---------- */
.gate{position:fixed;inset:0;z-index:100;background:radial-gradient(1200px 600px at 20% -10%,#16345e 0%,#0d1f3a 55%,#0a1830 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.gate.hide{display:none}
.gate-card{background:rgba(255,255,255,.97);border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.45);width:400px;max-width:100%;padding:34px 30px 28px;text-align:center}
.gate-card .gico{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;background:linear-gradient(135deg,#0b5cad,#123a6d);display:flex;align-items:center;justify-content:center;font-size:26px}
.gate-card h2{font-size:17px;font-weight:700}
.gate-card .gsub{font-size:12px;color:var(--ink3);margin-top:6px}
.gate-card input{width:100%;margin-top:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;letter-spacing:2px;text-align:center;outline:none;transition:border .15s}
.gate-card input:focus{border-color:var(--accent)}
.gate-card .gerr{color:#c0392b;font-size:12px;margin-top:8px;min-height:16px}
.gate-card .gbtn{width:100%;margin-top:10px;padding:11px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.gate-card .gbtn:disabled{opacity:.6;cursor:wait}
.gate-card .gfoot{margin-top:18px;font-size:10.5px;color:var(--ink3);line-height:1.7}
.gate-closed{color:#fff;text-align:center}
.gate-closed .cico{font-size:44px;margin-bottom:14px}
.gate-closed h2{font-size:18px;font-weight:700}
.gate-closed p{margin-top:8px;font-size:13px;color:rgba(255,255,255,.65)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- 页脚 ---------- */
.foot{max-width:1200px;margin:0 auto;padding:0 16px 30px;font-size:11px;color:var(--ink3);line-height:1.8}

/* ---------- 移动端 ---------- */
@media (max-width:640px){
  .topbar{padding:14px 14px 12px}
  .topbar h1{font-size:16.5px}
  .stats{grid-template-columns:repeat(2,1fr);padding:12px 12px 0}
  .stat .val{font-size:18px}
  .tabwrap{padding:0 10px}
  .tab{max-width:none;font-size:13px;padding:8px 6px}
  .tb th{top:44px}
  .drawer{width:100vw}
  .vfull{max-width:160px}
}
</style>
</head>

function gateShow(html){ const g=$('#gate'); g.innerHTML=html; g.classList.remove('hide'); g.style.display='flex'; }
function gateHide(){ const g=$('#gate'); g.classList.add('hide'); setTimeout(()=>g.style.display='none',250); }

async function gateBoot(){
  // 远程开关两态：pwd=密码常态（当面开放由持密人现场输入）/ closed=收回
  let mode = 'pwd';
  try{
    const r = await fetch('flag.json', {cache:'no-store'});
    if(r.ok){ const f = await r.json(); if(f.mode==='closed') mode = 'closed'; }
  }catch(e){ /* 开关不可达时按密码常态，安全性不降 */ }

  if(mode === 'closed'){
    gateShow('<div class="gate-closed"><div class="cico">🛡️</div><h2>看板暂未开放</h2><p>内容已临时收回，如需访问请联系看板管理员。</p></div>');
    return;
  }
  gateLock();
}

function gateLock(){
  gateShow(`
    <div class="gate-card" id="gCard">
      <div class="gico">🔐</div>
      <h2>金融 IT 厂商中标看板</h2>
      <div class="gsub">数据受保护 · 请输入访问密码</div>
      <input id="gPwd" type="password" placeholder="访问密码" autocomplete="off" autofocus>
      <div class="gerr" id="gErr"></div>
      <button class="gbtn" id="gBtn">解 锁</button>
      <div class="gfoot">密码按人发放，请勿转发。<br>解锁后数据仅在本次浏览会话中解密。</div>
    </div>`);
  const go = () => tryUnlock($('#gPwd').value);
  $('#gBtn').onclick = go;
  $('#gPwd').addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
  $('#gPwd').focus();
}

async function tryUnlock(pwd){
  if(!pwd) return;
  const btn = $('#gBtn'), err = $('#gErr');
  btn.disabled = true; btn.textContent = '解锁中…'; err.textContent = '';
  try{
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveKey']);
    const kek = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64d(GATE.salt), iterations:310000, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    let dek = null;
    for(const w of GATE.wraps){
      try{ dek = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(w.iv)}, kek, b64d(w.ct)); break; }catch(e){}
    }
    if(!dek) throw new Error('bad password');
    const dekKey = await crypto.subtle.importKey('raw', dek, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(GATE.iv)}, dekKey, b64d(GATE.ct));
    const data = JSON.parse(new TextDecoder().decode(plain));
    gateHide();
    boot(data);
  }catch(e){
    err.textContent = '密码不正确，请重试';
    const card = $('#gCard'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    btn.disabled = false; btn.textContent = '解 锁';
  }
}

/* ================= 启动 ================= */
function boot(data){
  OV = data.ov; DET = data.det;
  DETMAP = {}; (DET.vendors||[]).forEach(v => DETMAP[v.n] = v);
  // 各厂商"各期披露中标金额"序列：由明细条目（amt+期序 pi）实时聚合——
  // 11-06 周老师裁定：火花线/走势列画金额走势（旧版误用次数序列，已纠正）；
  // 同日二次裁定：趋势列跟随排序指标联动（按金额→金额走势，按次数→次数走势），
  // 故次数序列也在此一并按 pi 聚合（cp = counts per period）。
  const nP = (OV.periods||[]).length;
  (DET.vendors||[]).forEach(v => {
    const ap = new Array(nP).fill(0);
    const cp = new Array(nP).fill(0);
    (v.items||[]).forEach(x => {
      if(x.pi >= 0 && x.pi < nP){
        cp[x.pi] += 1;
        if(typeof x.amt === 'number') ap[x.pi] += x.amt;
      }
    });
    v.ap = ap; v.cp = cp;
  });
  $('#app').style.display = '';
  renderMeta(); renderChart(); bindTabs(); bindOv(); bindDet(); bindDrawer(); bindCsv();
  window.__VB_OK = true;
}

/* ================= 元信息 ================= */
function renderMeta(){
  const m = DET.meta || {};
  $('#mRange').textContent = m.range || '—';
  $('#mPeriods').textContent = (OV.periods||[]).length + ' 期';
  $('#mBuilt').textContent = (m.built||'').replace(' ', ' · ') || '—';
  $('#footBuilt').textContent = '本页生成：' + (m.built||'—') + ' · 数据快照随暂存库每日刷新';
  $('#sAmt').innerHTML = fmtWan(m.totA ?? OV.meta?.totA).replace(' 亿','<small> 亿元</small>').replace(' 万','<small> 万元</small>');
  $('#sAmtSub').textContent = '全口径含未披露金额项目';
  $('#sCnt').textContent = (m.totC ?? 0).toLocaleString();
  $('#sCntSub').textContent = '条中标记录';
  $('#sVen').textContent = (m.n ?? 0).toLocaleString();
  $('#sVenSub').textContent = '家有中标记录厂商';
  const ps = OV.periods || [], n = ps.length;
  $('#sLast').textContent = ps[n-1] || '—';
  const lc = OV.totCnt[n-1] ?? 0, la = OV.totAmt[n-1] ?? 0;
  $('#sLastSub').textContent = lc + ' 个项目 · ' + fmtWan(la);
  const nz = arr => (arr||[]).filter(v => !(v.c === 0 && v.a === 0)).length;
  $('#cOv').textContent = nz(OV.vendors) + ' 家';
  $('#cDet').textContent = nz(DET.vendors) + ' 家';
}

/* ================= 趋势图（双纵轴：左轴全市场金额/右轴恒生系金额 + 柱顶数字标签） ================= */
function renderChart(){
  const ps = OV.periods||[], amt = OV.totAmt||[], hs = OV.hsAmt||[];
  const W = 1000, H = 252, padL = 48, padB = 34, padT = 22, padR = 52;
  const plotH = H - padT - padB;
  const maxA = Math.max(...amt, 1);
  const maxH = Math.max(...hs, 1) * 1.15;
  const bw = (W - padL - padR) / ps.length;
  const fmtYi = v => v >= 10000 ? (v/10000).toFixed(1)+'亿' : Math.round(v)+'万';
  let bars = '', pts = [], xlab = '', blab = '';
  ps.forEach((p, i) => {
    const x = padL + i*bw;
    const h = (amt[i]/maxA) * plotH;
    const y = H - padB - h;
    bars += `<rect x="${(x+bw*0.18).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="#0b5cad" opacity="0.85" data-tip="${esc(p)}｜全市场 <b>${fmtWan(amt[i])}</b><br>恒生系 <b>${fmtWan(hs[i]||0)}</b>"/>`;
    blab += `<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" font-size="9.5" fill="#42506b" text-anchor="middle">${fmtYi(amt[i])}</text>`;
    const px = x + bw/2, py = H - padB - ((hs[i]||0)/maxH)*plotH; // 右轴比例
    pts.push(`${px.toFixed(1)},${py.toFixed(1)}`);
    xlab += `<text x="${px.toFixed(1)}" y="${H-12}" font-size="10" fill="#8a94a3" text-anchor="middle">${esc(p)}</text>`;
  });
  const line = `<polyline points="${pts.join(' ')}" fill="none" stroke="#0b6e4f" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>` +
         pts.map(p => { const [x,y] = p.split(','); return `<circle cx="${x}" cy="${y}" r="3.2" fill="#0b6e4f"/>`; }).join('');
  let yl = '';
  for(let i=0;i<=4;i++){
    const v = maxA*i/4, y = H - padB - plotH*i/4;
    yl += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#eef1f6" stroke-width="1"/><text x="${padL-6}" y="${y+3.5}" font-size="10" fill="#8a94a3" text-anchor="end">${(v/10000).toFixed(0)}亿</text>`;
    const hv = maxH*i/4;
    yl += `<text x="${W-padR+6}" y="${y+3.5}" font-size="10" fill="#0b6e4f" text-anchor="start">${fmtYi(hv)}</text>`;
  }
  $('#chartBox').innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" id="trendSvg">${yl}${bars}${blab}${line}${xlab}</svg>`;
  const tip = $('#tip'), svg = $('#trendSvg');
  svg.addEventListener('mousemove', e => {
    const t = e.target;
    if(t.dataset && t.dataset.tip){ tip.innerHTML = t.dataset.tip; tip.style.opacity = 1;
      tip.style.left = Math.min(e.clientX+12, innerWidth-270)+'px'; tip.style.top = (e.clientY+14)+'px'; }
    else tip.style.opacity = 0;
  });
  svg.addEventListener('mouseleave', () => tip.style.opacity = 0);
}

/* ================= 概览表 ================= */
let ovState = {q:'', g:'', s:'a'};
function bindOv(){
  $('#qOv').addEventListener('input', e => { ovState.q = e.target.value.trim().toLowerCase(); renderOv(); });
  $('#grpChips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b) return;
    $$('#grpChips .chip').forEach(c => c.classList.remove('on')); b.classList.add('on');
    ovState.g = b.dataset.g; renderOv();
  });
  $('#sortSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    $$('#sortSeg button').forEach(c => c.classList.remove('on')); b.classList.add('on');
    ovState.s = b.dataset.s; renderOv();
  });
  renderOv();
}
function sparkSvg(p){
  const w = 100, h = 26, max = Math.max(...p, 1);
  const pts = p.map((v,i) => `${(i/(p.length-1)*w).toFixed(1)},${(h-2-(v/max)*(h-6)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts.join(' ')}" fill="none" stroke="#0b5cad" stroke-width="1.8" stroke-linejoin="round" opacity="0.8" vector-effect="non-scaling-stroke"/></svg>`;
}
function amtSpark(n){ return sparkSvg((DETMAP[n]?.ap) || []); }
/* 趋势列联动排序指标：按金额→披露金额走势；按次数→中标次数走势（11-06 周老师二次裁定） */
function trendSpark(v, s){ return s === 'c' ? sparkSvg(v.cp || v.p || []) : amtSpark(v.n); }
function trendHead(s){ return s === 'c' ? '各期趋势（中标次数）' : '各期趋势（披露中标金额）'; }
function trendHeadDet(s){ return s === 'c' ? '每期走势（中标次数）' : '每期走势（披露中标金额）'; }
function renderOv(){
  let vs = (OV.vendors||[]).slice();
  if(!ovState.g) vs = vs.filter(v => !(v.c === 0 && v.a === 0)); // 零行仅分组视图可见（09-28 机制）
  // 竞品视图冗余纳入恒生电子，便于竞对比对（11-06 周老师裁定）
  if(ovState.g) vs = vs.filter(v => ovState.g === '应用软件竞品'
    ? (v.g === '应用软件竞品' || v.n === '恒生电子') : v.g === ovState.g);
  if(ovState.q) vs = vs.filter(v => v.n.toLowerCase().includes(ovState.q) || (DETMAP[v.n]?.full||'').toLowerCase().includes(ovState.q));
  vs.sort((a,b) => ovState.s === 'c' ? (b.c-a.c) || (b.a-a.a) : (b.a-a.a) || (b.c-a.c));
  const hd = $('#ovSparkHead'); if(hd) hd.textContent = trendHead(ovState.s);
  const tb = $('#tbOv tbody');
  if(!vs.length){ tb.innerHTML = '<tr><td colspan="6"><div class="empty">无匹配厂商</div></td></tr>'; return; }
  tb.innerHTML = vs.map((v,i) => `
    <tr class="clickable" data-n="${esc(v.n)}">
      <td><span class="rk ${i<3?'r'+(i+1):''}">${i+1}</span></td>
      <td><span class="vname">${esc(v.n)}</span><span class="vfull">${esc(DETMAP[v.n]?.full || '')}</span></td>
      <td>${tagHtml(v.g)}</td>
      <td>${trendSpark(v, ovState.s)}</td>
      <td class="cnt-n">${v.c}</td>
      <td class="amt">${fmtWan2(v.a)}<small> 万</small></td>
    </tr>`).join('');
}

/* ================= 明细表（分块渲染） ================= */
let detState = {q:'', g:'', s:'a', shown:0};
const CHUNK = 80;
function bindDet(){
  $('#qDet').addEventListener('input', e => { detState.q = e.target.value.trim().toLowerCase(); renderDet(true); });
  $('#grpChips2').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b) return;
    $$('#grpChips2 .chip').forEach(c => c.classList.remove('on')); b.classList.add('on');
    detState.g = b.dataset.g; renderDet(true);
  });
  $('#sortSeg2').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    $$('#sortSeg2 button').forEach(c => c.classList.remove('on')); b.classList.add('on');
    detState.s = b.dataset.s; renderDet(true);
  });
  new IntersectionObserver(es => { if(es[0].isIntersecting) renderDet(false); }, {rootMargin:'320px'}).observe($('#detMore'));
  renderDet(true);
}
function detFiltered(){
  let vs = (DET.vendors||[]).slice();
  if(!detState.g) vs = vs.filter(v => !(v.c === 0 && v.a === 0)); // 零行仅分组视图可见
  // 竞品视图冗余纳入恒生电子，便于竞对比对（与概览表同口径）
  if(detState.g) vs = vs.filter(v => detState.g === '应用软件竞品'
    ? (v.g === '应用软件竞品' || v.n === '恒生电子') : v.g === detState.g);
  if(detState.q) vs = vs.filter(v => v.n.toLowerCase().includes(detState.q) || (v.full||'').toLowerCase().includes(detState.q));
  vs.sort((a,b) => detState.s === 'c' ? (b.c-a.c) || (b.a-a.a) : (b.a-a.a) || (b.c-a.c));
  return vs;
}
/* 明细双形态：无过滤=分栏墙（每栏30家，一栏一屏看全）；有搜索/分组过滤=表格（独立滚动区+固定表头+分块加载） */
function renderDet(reset){
  const filtered = !!(detState.q || detState.g);
  const vs = detFiltered();
  const wall = $('#detWall'), tbl = $('#tbDet'), wrap = $('#detWrap');
  if(!filtered){
    tbl.style.display = 'none';
    wrap.classList.remove('box');
    $('#detMore').style.display = 'none';
    wall.style.display = '';
    wall.innerHTML = detWallHtml(vs);
    return;
  }
  wall.style.display = 'none';
  wall.innerHTML = '';
  tbl.style.display = '';
  wrap.classList.add('box'); // 表格模式：容器自带垂直/水平滚动条，表头钉在容器顶
  $('#detMore').style.display = '';
  // 表头/列宽：分组过滤时冗余"每期走势（披露中标金额）"列（窄屏 CSS 隐藏）
  const withSpark = !!detState.g;
  $('#detCols').innerHTML = withSpark
    ? '<col style="width:44px"><col style="width:30%"><col style="width:80px"><col style="width:28%"><col style="width:58px"><col style="width:112px">'
    : '<col style="width:44px"><col><col style="width:84px"><col style="width:62px"><col style="width:118px">';
  $('#detHead').innerHTML = withSpark
    ? `<th>#</th><th>厂商</th><th>分组</th><th class="thwrap">${trendHeadDet(detState.s)}</th><th>次数</th><th>金额</th>`
    : '<th>#</th><th>厂商</th><th>分组</th><th>次数</th><th>金额</th>';
  const tb = $('#tbDet tbody');
  if(reset){ detState.shown = 0; tb.innerHTML = ''; }
  if(!vs.length){
    if(reset) tb.innerHTML = `<tr><td colspan="${withSpark?6:5}"><div class="empty">无匹配厂商</div></td></tr>`;
    $('#detMore').textContent = '';
    return;
  }
  const slice = vs.slice(detState.shown, detState.shown + CHUNK);
  tb.insertAdjacentHTML('beforeend', slice.map((v,i) => {
    const gIdx = detState.shown + i;
    return `
    <tr class="clickable" data-n="${esc(v.n)}">
      <td><span class="rk ${gIdx<3?'r'+(gIdx+1):''}">${gIdx+1}</span></td>
      <td><span class="vname">${esc(v.n)}</span><span class="vfull">${esc(v.full||'')}</span></td>
      <td>${tagHtml(v.g)}</td>
      ${withSpark ? `<td class="cspk">${trendSpark(v, detState.s)}</td>` : ''}
      <td class="cnt-n">${v.c}</td>
      <td class="amt">${fmtWan2(v.a)}<small> 万</small></td>
    </tr>`;
  }).join(''));
  detState.shown += slice.length;
  $('#detMore').textContent = detState.shown >= vs.length ? `共 ${vs.length} 家 · 点击行查看中标明细` : `已加载 ${detState.shown}/${vs.length} 家，下拉加载更多…`;
}
function detWallHtml(vs){
  if(!vs.length) return '<div class="empty" style="grid-column:1/-1">无匹配厂商</div>';
  const PER = 30, cols = [];
  for(let i = 0; i < vs.length; i += PER) cols.push(vs.slice(i, i + PER));
  return cols.map((col, ci) => `
    <div class="detcol">
      <div class="detcol-hd"><span>第 ${ci*PER+1} – ${ci*PER+col.length} 名</span><span>${col.length} 家</span></div>
      ${col.map((v, j) => {
        const g = ci*PER + j;
        const gc = v.g === '应用软件竞品' ? ' cp' : (v.g === '恒生系' ? ' hs' : '');
        return `<div class="detrow${gc}" data-n="${esc(v.n)}" title="${esc(v.full || '')}">
          <span class="rk ${g<3?'r'+(g+1):''}">${g+1}</span>
          <span class="nm">${esc(v.n)}</span>
          <span class="mc">${v.c}次</span>
          <span class="as">${fmtWan(v.a)}</span>
        </div>`;
      }).join('')}
    </div>`).join('');
}

/* ================= 抽屉 ================= */
function bindDrawer(){
  $('#tbOv tbody').addEventListener('click', e => { const tr = e.target.closest('tr.clickable'); if(tr) openDrawer(tr.dataset.n); });
  $('#tbDet tbody').addEventListener('click', e => { const tr = e.target.closest('tr.clickable'); if(tr) openDrawer(tr.dataset.n); });
  $('#detWall').addEventListener('click', e => { const r = e.target.closest('.detrow'); if(r) openDrawer(r.dataset.n); });
  $('#dClose').onclick = closeDrawer;
  $('#mask').onclick = closeDrawer;
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeDrawer(); });
}
function openDrawer(n){
  const v = DETMAP[n]; if(!v) return;
  $('#dName').textContent = n;
  $('#dFull').textContent = v.full || '';
  const items = (v.items||[]).slice().sort((a,b) => (b.d||'').localeCompare(a.d||''));
  const sumA = items.reduce((s,x) => s + (x.amt||0), 0);
  $('#dSub').innerHTML = `
    <span>中标 <b>${items.length}</b> 次</span>
    <span>已确认金额 <b>${fmtWan(sumA)}</b></span>
    ${v.g ? `<span>${tagHtml(v.g)}</span>` : ''}`;
  $('#dBody').innerHTML = items.length ? items.map(x => `
    <div class="itm">
      <div class="row1">
        <div class="pn"><a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.p)}</a></div>
        <div class="ia num">${x.amt ? fmtWan2(x.amt)+'<small style="color:var(--ink3);font-weight:400"> 万</small>' : '<small style="color:var(--ink3)">未披露</small>'}</div>
      </div>
      <div class="row2"><span>${esc(x.d||'')}</span><span class="org">${esc(x.os||'')}</span>${x.note?`<span>${esc(x.note)}</span>`:''}</div>
    </div>`).join('') : '<div class="empty">该厂商暂无明细记录</div>';
  $('#mask').classList.add('show'); $('#drawer').classList.add('show');
  $('#dBody').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeDrawer(){
  $('#mask').classList.remove('show'); $('#drawer').classList.remove('show');
  document.body.style.overflow = '';
}

/* ================= 标签页 ================= */
function bindTabs(){
  $$('.tab').forEach(t => t.addEventListener('click', () => {
    $$('.tab').forEach(x => x.classList.remove('on')); t.classList.add('on');
    $$('.pane').forEach(p => p.classList.remove('on'));
    $('#' + t.dataset.pane).classList.add('on');
  }));
}

/* ================= CSV 导出 ================= */
function bindCsv(){
  $('#btnCsv').onclick = () => {
    const rows = [['厂商简称','厂商全称','分组','日期','项目名称','采购方','金额(万元)','来源链接']];
    (DET.vendors||[]).forEach(v => (v.items||[]).forEach(x =>
      rows.push([v.n, v.full||'', v.g||'', x.d||'', x.p||'', x.os||'', x.amt??'', x.u||''])));
    const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = 'IT厂商中标明细_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click(); URL.revokeObjectURL(a.href);
  };
}

/* ================= 入口 ================= */
// 宿主检测：iframe 内（侧栏小组件）顶部 80px 为系统悬浮/拖拽层，整页下移避让，
// 标签页等可点控件全部离开悬停区（11-06 周老师抓包"标签页 90% 点不中"根因）
try{ if(window.self !== window.top) document.body.classList.add('host'); }catch(e){}
/* 免密明文版入口：open 档下任何人直接看，但 flag=closed 仍可即时收回（11-06 周老师三问落地） */
async function plainEntry(){
  try{
    const r = await fetch('flag.json', {cache:'no-store'});
    if(r.ok){
      const f = await r.json();
      if(f.mode === 'closed'){
        gateShow('<div class="gate-closed"><div class="cico">🛡️</div><h2>看板暂未开放</h2><p>内容已临时收回，如需访问请联系看板管理员。</p></div>');
        return;
      }
    }
  }catch(e){ /* 开关不可达时放行（明文版无密可保，不放行会影响演示） */ }
  boot(BLOB);
}
if(BLOB.enc){
  gateBoot();
}else{
  plainEntry();
}
